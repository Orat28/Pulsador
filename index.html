<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Pulsador - OneNote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #121212; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; text-align: center; }
    
    .setup-box { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
    input, textarea { width: 100%; background: #282828; border: 1px solid #444; border-radius: 8px; color: #fff; padding: 12px; font-size: 1rem; outline: none; }
    textarea { height: 90px; resize: vertical; }

    .checkbox-host { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; color: #ffca28; margin-top: 5px; cursor: pointer; }

    .btn-join, .btn-send, .btn-action { height: 44px; background: #1db954; color: #000; font-weight: bold; border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer; width: 100%; }
    .btn-skip { background: #e91e63; color: #fff; }
    .btn-next { background: #2196f3; color: #fff; }
    
    .game-box { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; }
    .status-text { font-size: 1.2rem; color: #aaa; font-weight: bold; }
    
    .buzzer-btn { width: 210px; height: 210px; border-radius: 50%; background: radial-gradient(circle, #ff4d4d 0%, #cc0000 100%); border: 8px solid #800000; box-shadow: 0 10px 25px rgba(255, 0, 0, 0.4); color: #fff; font-size: 2rem; font-weight: 900; cursor: pointer; user-select: none; }
    .buzzer-btn:disabled { background: #444; border-color: #222; box-shadow: none; color: #777; cursor: not-allowed; }
    
    .answer-box { display: none; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin: auto; }
    
    /* Panel Host Compacto */
    .host-panel { display: none; flex-direction: column; gap: 8px; width: 100%; max-width: 340px; background: #1e1e1e; padding: 10px; border-radius: 12px; border: 1px solid #333; }
    .toggle-links-btn { background: #333; color: #ffca28; border: 1px solid #555; padding: 6px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
    .links-container { display: none; flex-direction: column; gap: 8px; margin-top: 4px; }
  </style>
</head>
<body>

  <!-- PANTALLA INICIAL DE INGRESO -->
  <div class="setup-box" id="setupBox">
    <h2>OneNote Buzzer</h2>
    <input type="text" id="playerName" placeholder="Tu Nombre..." />
    <input type="text" id="roomCode" value="1234" placeholder="Código de Sala" />
    
    <label class="checkbox-host">
      <input type="checkbox" id="isHostCheck" /> Entrar como Administrador (Host)
    </label>

    <button class="btn-join" id="joinBtn">Entrar a la Sala</button>
  </div>

  <!-- PANTALLA PRINCIPAL DEL JUEGO -->
  <div class="game-box" id="gameBox">
    <div class="status-text" id="statusText">Esperando a la TV...</div>

    <!-- BOTÓN PULSADOR -->
    <button class="buzzer-btn" id="buzzerBtn" disabled>¡YO!</button>

    <!-- CAMPO PARA RESPONDER SI GANÓ EL PULSADOR -->
    <div class="answer-box" id="answerBox">
      <input type="text" id="guessInput" placeholder="Escribe el nombre de la canción..." autocomplete="off" />
      <button class="btn-send" id="sendBtn">Enviar Respuesta</button>
    </div>

    <!-- PANEL DE CONTROL COMPACTO PARA EL HOST -->
    <div class="host-panel" id="hostPanel">
      <div style="display: flex; gap: 6px;">
        <button class="btn-action" id="hostPlayBtn" style="background: #1db954;">▶ Play</button>
        <button class="btn-action btn-skip" id="hostSkipBtn">⏩ Skip</button>
        <button class="btn-action btn-next" id="hostNextBtn">⏭️ Siguiente</button>
      </div>

      <button class="toggle-links-btn" id="toggleLinksBtn">⚙️ Cargar Playlist en TV</button>

      <div class="links-container" id="linksContainer">
        <textarea id="playlistInput" placeholder="Pega enlaces de YouTube (uno por línea)..."></textarea>
        <button class="btn-action" id="loadPlaylistBtn" style="background: #ffca28; color: #000; height: 38px;">Enviar Lista a TV</button>
      </div>
    </div>

    <div>Jugador: <strong id="displayName"></strong></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD3vC1zAURPHt2rCLmPF06xElC4KnpWpDU",
      authDomain: "en-una.firebaseapp.com",
      databaseURL: "https://en-una-default-rtdb.firebaseio.com",
      projectId: "en-una",
      storageBucket: "en-una.firebasestorage.app",
      messagingSenderId: "862732139888",
      appId: "1:862732139888:web:7f246b1bdd5f7f97b863b5",
      measurementId: "G-41X7749JTT"
    };

    try {
      firebase.initializeApp(firebaseConfig);
    } catch(e) {
      alert("Error en la configuración de Firebase.");
    }

    const db = firebase.database();
    let roomRef = null, playerName = "", isHost = false;

    const setupBox = document.getElementById('setupBox');
    const gameBox = document.getElementById('gameBox');
    const statusText = document.getElementById('statusText');
    const buzzerBtn = document.getElementById('buzzerBtn');
    const answerBox = document.getElementById('answerBox');
    const guessInput = document.getElementById('guessInput');
    const sendBtn = document.getElementById('sendBtn');
    const hostPanel = document.getElementById('hostPanel');
    const linksContainer = document.getElementById('linksContainer');

    document.getElementById('joinBtn').addEventListener('click', () => {
      playerName = document.getElementById('playerName').value.trim();
      const code = document.getElementById('roomCode').value.trim();
      isHost = document.getElementById('isHostCheck').checked;

      if (!playerName || !code) return alert('Completa tu nombre y código.');

      setupBox.style.display = 'none';
      gameBox.style.display = 'flex';
      document.getElementById('displayName').textContent = playerName + (isHost ? " (Host)" : "");

      if (isHost) {
        hostPanel.style.display = 'flex';
      }

      roomRef = db.ref(`rooms/${code}`);

      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        
        if (!data) {
          statusText.textContent = 'Inicia el juego en la TV/PC primero...';
          statusText.style.color = '#ffca28';
          buzzerBtn.style.display = 'block';
          buzzerBtn.disabled = true;
          answerBox.style.display = 'none';
          return;
        }

        if (data.state === 'PLAYING') {
          statusText.textContent = '¡PRESIONA AHORA!';
          statusText.style.color = '#1db954';
          buzzerBtn.style.display = 'block';
          buzzerBtn.disabled = false;
          answerBox.style.display = 'none';
        } else if (data.state === 'BUZZED') {
          if (data.first_buzzer && data.first_buzzer.player_name === playerName) {
            if (data.submitted_guess) {
              statusText.textContent = 'Respuesta enviada. Verificando...';
              statusText.style.color = '#1db954';
              buzzerBtn.style.display = 'none';
              answerBox.style.display = 'none';
            } else {
              statusText.textContent = '¡TOCASTE PRIMERO! Escribe tu respuesta:';
              statusText.style.color = '#1db954';
              buzzerBtn.style.display = 'none';
              answerBox.style.display = 'flex';
              guessInput.focus();
            }
          } else {
            statusText.textContent = `Respondiendo: ${data.first_buzzer ? data.first_buzzer.player_name : 'Otro jugador'}`;
            statusText.style.color = '#e91e63';
            buzzerBtn.style.display = 'block';
            buzzerBtn.disabled = true;
            answerBox.style.display = 'none';
          }
        } else {
          statusText.textContent = 'Atento a la pantalla...';
          statusText.style.color = '#aaa';
          buzzerBtn.style.display = 'block';
          buzzerBtn.disabled = true;
          answerBox.style.display = 'none';
        }
      });
    });

    // Desplegar / Ocultar campo de links
    document.getElementById('toggleLinksBtn').addEventListener('click', () => {
      const isVisible = linksContainer.style.display === 'flex';
      linksContainer.style.display = isVisible ? 'none' : 'flex';
    });

    // Cargar Playlist
    document.getElementById('loadPlaylistBtn').addEventListener('click', () => {
      const links = document.getElementById('playlistInput').value.trim();
      if (!links || !roomRef) return alert("Ingresa enlaces de YouTube.");
      
      roomRef.update({
        playlist_urls: links,
        cmd: 'LOAD_PLAYLIST',
        timestamp: Date.now()
      });
      linksContainer.style.display = 'none';
    });

    // Controles remotos del Host
    document.getElementById('hostPlayBtn').addEventListener('click', () => {
      if (!roomRef) return;
      roomRef.update({ cmd: 'PLAY', timestamp: Date.now() });
    });

    document.getElementById('hostSkipBtn').addEventListener('click', () => {
      if (!roomRef) return;
      roomRef.update({ cmd: 'SKIP', timestamp: Date.now() });
    });

    document.getElementById('hostNextBtn').addEventListener('click', () => {
      if (!roomRef) return;
      roomRef.update({ cmd: 'NEXT_SONG', timestamp: Date.now() });
    });

    function submitGuess() {
      const text = guessInput.value.trim();
      if (!text || !roomRef) return;

      roomRef.update({
        submitted_guess: { player_name: playerName, text: text }
      });

      guessInput.value = '';
      answerBox.style.display = 'none';
    }

    sendBtn.addEventListener('click', submitGuess);
    guessInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitGuess(); });

    buzzerBtn.addEventListener('click', () => {
      if (!roomRef) return;
      roomRef.transaction((currentData) => {
        if (currentData && currentData.state === 'PLAYING') {
          currentData.state = 'BUZZED';
          currentData.first_buzzer = { player_name: playerName, timestamp: firebase.database.ServerValue.TIMESTAMP };
        }
        return currentData;
      });
    });
  </script>
</body>
</html>
